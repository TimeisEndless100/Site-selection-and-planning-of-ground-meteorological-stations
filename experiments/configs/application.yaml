# 应用展示：真实决策任务演示，决策指标与预测指标不可混比
# exp: app_infer, app_rmclp_gain, app_rmclp_vs_mclp
family: application

# 整域推理（原 E9）：CNN 概率图 → 为 RMCLP 提供候选源；本身不单独成表
app_infer:
  stage: cnn
  output: "全域概率栅格（候选源）"
  downstream: [app_rmclp_gain]

# RMCLP 选址收益（原 E10）：候选源随机/gis/cnn/purn/purn_gnn
# ⚠️ 决策链未闭合（约束/需求参数未定），当前结论不可写死，须先校准或降级为敏感性演示
app_rmclp_gain:
  stage: decision
  metric: rmclp_gain
  cells:
    candidate_source: [random, gis, cnn, purn, purn_gnn]
  constraints:
    n_cover: 8
    radius_km: 25
  note: 与 AUC 不可混比；上游退化（P5 last-epoch）修复后再定论

# RMCLP vs MCLP × rn_on/off（原 E15）
app_rmclp_vs_mclp:
  stage: decision
  metric: rmclp_gain
  cells:
    model: [rmclp, mclp]
    rn: ["on", "off"]   # 引号：YAML 会把裸 on/off 解析成布尔值
  note: 上游退化全 0，先修上游（app_rmclp_gain 决策链）再重跑
